# Render Blueprint: New -> Blueprint -> pick this repo. Creates the database and the web service.
databases:
  - name: suryaops-db
    plan: free
    databaseName: suryaops
    user: suryaops

services:
  - type: web
    name: suryaops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suryaops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true