# Render Blueprint: New -> Blueprint -> pick this repo. Creates the database and the web service.
databases:
  - name: rayora-db
    plan: free
    databaseName: rayora
    user: rayora

services:
  - type: web
    name: rayora
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rayora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true