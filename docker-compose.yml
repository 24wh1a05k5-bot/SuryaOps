# Optional: run PostgreSQL in Docker instead of installing it locally.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: suryaops
      POSTGRES_PASSWORD: suryaops
      POSTGRES_DB: suryaops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suryaops"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
